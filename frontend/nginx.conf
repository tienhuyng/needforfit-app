server {
    listen 80;
    server_name _;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    root /usr/share/nginx/html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Health check for load balancers / Docker HEALTHCHECK
    location = /health {
        access_log off;
        default_type text/plain;
        add_header Content-Type "text/plain; charset=utf-8" always;
        return 200 "ok";
    }

    # Vite hashed assets — cache 1 year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Static assets — cache 1 year (immutable)
    location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|svg|woff|woff2|ttf|eot|ico|webp|json|map)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Direct index.html — never cache
    location = /index.html {
        default_type text/html;
        add_header Content-Type "text/html; charset=utf-8" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # SPA routing: file → directory → fallback
    location / {
        try_files $uri $uri/ @spa;
    }

    # SPA fallback (/, /login, etc.) — always serve fresh index.html
    location @spa {
        default_type text/html;
        add_header Content-Type "text/html; charset=utf-8" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        rewrite ^ /index.html break;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
}
